<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
        }

        section {
            padding: 2em;
        }

        p {
            font-size: 1.2em;
            color: #333;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Logout Confirmation</h1>
    </header>

    <section>
        <p>You have been successfully logged out.</p>
        <button onclick="redirectToLogin()">Login Again</button>
    </section>

    <footer>
        &copy; 2023 Logout Confirmation. All rights reserved.
    </footer>

    <script>
        // Function to redirect to the login page
        function redirectToLogin() {
            // You can replace 'login.html' with the actual path to your login page
            window.location.href = 'login.html';
        }
    </script>

</body>

</html>
