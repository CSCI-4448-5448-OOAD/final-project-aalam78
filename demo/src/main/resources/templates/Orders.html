<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
        }

        section {
            padding: 2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: #fff;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 8px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Order Page</h1>
    </header>

    <section>
        <table>
            <thead>
                <tr>
                    <th>Order Number</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="orderItems">
                <!-- Order items will be dynamically added here -->
            </tbody>
        </table>
    </section>

    <footer>
        &copy; 2023 Order Page. All rights reserved.
    </footer>

    <script>
        // Sample data for demonstration purposes
        const orderItemsData = [
            { orderNumber: '12345', productName: 'Product A', quantity: 2, price: 10.00 },
            { orderNumber: '67890', productName: 'Product B', quantity: 1, price: 15.00 },
            // Add more orders as needed
        ];

        // Function to render order items
        function renderOrderItems() {
            const orderItemsContainer = document.getElementById('orderItems');

            // Clear existing content
            orderItemsContainer.innerHTML = '';

            // Render each item in the orders
            orderItemsData.forEach(item => {
                const row = document.createElement('tr');

                const orderNumberCell = document.createElement('td');
                orderNumberCell.textContent = item.orderNumber;

                const productNameCell = document.createElement('td');
                productNameCell.textContent = item.productName;

                const quantityCell = document.createElement('td');
                quantityCell.textContent = item.quantity;

                const priceCell = document.createElement('td');
                priceCell.textContent = `$${item.price.toFixed(2)}`;

                const viewDetailsButtonCell = document.createElement('td');
                const viewDetailsButton = document.createElement('button');
                viewDetailsButton.textContent = 'View Details';
                viewDetailsButton.onclick = () => viewOrderDetails(item.orderNumber);
                viewDetailsButtonCell.appendChild(viewDetailsButton);

                // Append cells to the row
                row.appendChild(orderNumberCell);
                row.appendChild(productNameCell);
                row.appendChild(quantityCell);
                row.appendChild(priceCell);
                row.appendChild(viewDetailsButtonCell);

                // Append the row to the table
                orderItemsContainer.appendChild(row);
            });
        }

        // Function to view order details
        function viewOrderDetails(orderNumber) {
            // You can implement logic to show order details, possibly with a modal or a new page
            alert(`Viewing details for Order Number: ${orderNumber}`);
        }

        // Initial rendering of order items
        renderOrderItems();
    </script>

</body>

</html>
