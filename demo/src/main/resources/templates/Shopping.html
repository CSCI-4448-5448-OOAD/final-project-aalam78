<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
        }

        section {
            padding: 2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: #fff;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 8px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Shopping Page</h1>
    </header>

    <section>
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Product A</td>
                    <td>$10.00</td>
                    <td><button onclick="addToCart('Product A', 10.00)">Add to Cart</button></td>
                </tr>
                <tr>
                    <td>Product B</td>
                    <td>$15.00</td>
                    <td><button onclick="addToCart('Product B', 15.00)">Add to Cart</button></td>
                </tr>
                <!-- Add more inventory items as needed -->
            </tbody>
        </table>
    </section>

    <footer>
        &copy; 2023 Shopping Page. All rights reserved.
    </footer>

    <script>
        function addToCart(productName, price) {
            // You can implement logic to add items to the shopping cart here
            alert(`Added ${productName} to the cart. Price: $${price}`);
        }
    </script>

</body>

</html>
